name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # soundcard is deliberately excluded here: it needs a PulseAudio
          # server to import, which isn't available on CI runners, and the
          # tests only exercise the pure-logic modules (record_call.py,
          # which depends on it, has no unit tests).
          pip install numpy scikit-learn python-docx faster-whisper spacy pytest
          python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest -v
